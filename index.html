<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track what's in your fridge, freezer, and pantry, and know what's about to expire before it does." />
    <title>ExpiryMate</title>
    <!-- Inter, loaded from Google Fonts — the system-font stack this used to
         fall back to (Segoe UI/Roboto/etc.) is fine but generic; Inter is
         what most of the polished dashboard products this project is
         modelled on actually use, and it renders a noticeably tighter,
         more considered type scale at small sizes (stat tiles, badges,
         table cells) than the OS default. Falls back to the same system
         stack if the request fails, so nothing breaks offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme attribute before first paint, synchronously, so there's
      // no flash of the wrong theme while React mounts and useTheme() runs.
      // Kept in sync with src/hooks/useTheme.ts's own fallback logic. Dark
      // mode is the site default for first-time visitors with no stored
      // preference — it no longer follows the OS light/dark setting.
      (function () {
        try {
          var stored = localStorage.getItem('expirymate-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
